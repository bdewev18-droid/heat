name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: heat-apk
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build & Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.44.5"
          cache: true

      - name: Precache Flutter Android Artifacts
        run: flutter precache --android

      - name: Flutter Dependencies
        run: flutter pub get

      - name: Build Release APK
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Heat-Release-APK
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error

      - name: Extract Version
        id: get_version
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //')
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          tag_name: latest
          name: "Heat v${{ steps.get_version.outputs.version }}"
          body: |
            Application Android pour Heat (Circuit Deutschland).
            Version : **v${{ steps.get_version.outputs.version }}**

            Téléchargement direct de l'APK : [app-release.apk](https://github.com/bdewev18-droid/heat/releases/latest/download/app-release.apk)
          files: build/app/outputs/flutter-apk/app-release.apk
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
